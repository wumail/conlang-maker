name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # ─── V-ALL 全量门禁（EXECUTION_PLAN.md §0.2，共 8 条，顺序固定） ───

      - name: 1. i18n key consistency
        run: node scripts/i18n-check.mjs

      - name: 2. Version sync (package.json / Cargo.toml / tauri.conf.json)
        run: node scripts/version-check.mjs

      - name: 3. Core purity + type check
        run: bun run core:check

      - name: 4. Frontend type check
        run: bunx tsc --noEmit

      - name: 5. Frontend unit tests
        run: bun test src

      - name: 6. MCP type check
        run: bun run mcp:check

      - name: 7. MCP integration tests
        run: bun run mcp:test

      - name: Build MCP sidecar binary (required by Tauri build script)
        run: bun run mcp:build

      - name: 8. Rust backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
