name: Release Tauri App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            arch: aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            arch: x64
          - platform: ubuntu-22.04
            args: "--verbose"
            arch: ""
          - platform: windows-latest
            args: ""
            arch: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Configure Linux AppImage environment
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cat <<'EOF' > "$RUNNER_TEMP/patchelf-wrapper.sh"
          #!/usr/bin/env bash
          set -euo pipefail

          is_print_only=0
          is_mcp_sidecar=0
          for arg in "$@"; do
            case "$arg" in
              --print-rpath|--print-needed|--print-soname|--print-interpreter|--version|--help)
                is_print_only=1
                ;;
              */conlang-mcp|*/conlang-mcp-x86_64-unknown-linux-gnu)
                is_mcp_sidecar=1
                ;;
            esac
          done

          if [ "$is_mcp_sidecar" -eq 1 ] && [ "$is_print_only" -eq 0 ]; then
            exit 0
          fi

          exec /usr/bin/patchelf "$@"
          EOF
          chmod +x "$RUNNER_TEMP/patchelf-wrapper.sh"
          # Keep linuxdeploy from stripping or rewriting the Bun-compiled conlang-mcp ELF trailer,
          # and run linuxdeploy without requiring kernel FUSE mounts on CI runners.
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "PATCHELF=$RUNNER_TEMP/patchelf-wrapper.sh" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Conlang Maker ${{ github.ref_name }}
          releaseBody: |
            Automated release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
